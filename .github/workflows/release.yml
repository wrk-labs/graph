name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: verify tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: check
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER=$(cat VERSION)
          if [ "$TAG_VER" != "$FILE_VER" ]; then
            echo "ERROR: tag $TAG_VER does not match VERSION file $FILE_VER"
            exit 1
          fi
          echo "tag and VERSION match: $TAG_VER"

  test:
    name: run test suite
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: test
        # Builds the Samba container from Dockerfile.test and runs the suite
        # inside it. Privileged because connect mounts a real SMB share.
        run: make test

  linux-build:
    name: build .deb (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    container: debian:bullseye-slim   # oldest still-supported glibc → runs on
                                      # bullseye/bookworm/trixie/Ubuntu 22.04+
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest        # x86_64 native
          - arch: arm64
            runner: ubuntu-24.04-arm     # arm64 native (GitHub-hosted)
    steps:
      - name: install build deps
        # graph itself links against libc only; GTK and WebKitGTK are for
        # graph-shell, the display window. The rest is packaging plus git
        # for actions/checkout inside the container.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev fakeroot ca-certificates git \
            pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: build .deb
        run: make deb

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 1

  macos-build:
    name: build darwin tarball (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14            # Apple Silicon only; Intel runners deprecated
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: build
        # Floor of macOS 12 — covers anything actively maintained. No build
        # dependencies beyond the system frameworks: graph uses libc and
        # POSIX, Graph.app uses Cocoa and WebKit.
        run: make
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      - name: package tarball
        # Flat tarball (graph + Graph.app + LICENSE at root): what the cask
        # in Casks/ installs from.
        run: |
          VER=$(cat VERSION)
          ARCH=${{ matrix.arch }}
          mkdir -p dist
          tar -czf "dist/graph-${VER}-darwin-${ARCH}.tar.gz" graph Graph.app LICENSE
          ls -la dist/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    name: publish github release
    needs: [linux-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true
